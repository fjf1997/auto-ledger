name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:      # 允许在 GitHub 页面手动点「Run workflow」

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. 检出代码
      - uses: actions/checkout@v4

      # 2. 装 Java 17（Gradle 需要）
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. 装 Flutter
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter 版本
        run: flutter --version

      # 4. 生成 android/ 原生脚手架
      #    （仓库只带需要改写的源文件，gradle/wrapper 等由模板生成）
      - name: 生成 Android 脚手架
        run: |
          cd /tmp
          flutter create --org com.example --project-name auto_ledger scaffold
          cd scaffold
          rm -rf lib pubspec.yaml test
          # 只补齐缺失的脚手架文件（gradle/wrapper、res、gradle.properties 等），
          # 不覆盖仓库中已定制的 build.gradle / AndroidManifest.xml / MainActivity.kt
          rsync -a --ignore-existing --exclude '.git' ./ "$GITHUB_WORKSPACE/"

      - name: 用仓库源文件覆盖
        run: |
          cd "$GITHUB_WORKSPACE"
          # 仓库中 android/app/src/main 与 build.gradle 是定制过的，确保生效
          ls -R android/app/src/main | head -20

      # 5. 装依赖
      - name: flutter pub get
        run: flutter pub get

      # 6. 跑测试（可选，失败不阻断）
      - name: flutter test
        continue-on-error: true
        run: flutter test

      # 7. 构建 release APK（按 CPU 分包，体积小 40%）
      - name: 构建 APK
        run: flutter build apk --release --split-per-abi

      # 8. 同时构建一个通用包（任何手机都能装）
      - name: 构建通用 APK
        run: flutter build apk --release

      # 9. 上传产物，在 Actions 页面直接下载
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-ledger-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      # 10. 打 tag 时自动发 Release
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
