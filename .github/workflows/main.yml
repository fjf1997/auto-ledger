name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter 版本
        run: flutter --version

      - name: 备份定制源码
        run: |
          mkdir -p /tmp/keep/kotlin
          cp android/app/src/main/AndroidManifest.xml /tmp/keep/ 2>/dev/null || true
          cp -r android/app/src/main/kotlin/. /tmp/keep/kotlin/ 2>/dev/null || true
          ls -R /tmp/keep

      - name: 重建 Android 原生工程
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          rm -rf android
          cd /tmp && rm -rf scaffold
          flutter create --org com.example --project-name auto_ledger --platforms=android scaffold
          cp -r /tmp/scaffold/android "$GITHUB_WORKSPACE/android"

      - name: 恢复定制源码（保留模板 res 资源）
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          mkdir -p android/app/src/main/kotlin/com/example/auto_ledger
          [ -f /tmp/keep/AndroidManifest.xml ] && cp /tmp/keep/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          [ -d /tmp/keep/kotlin ] && cp -r /tmp/keep/kotlin/. android/app/src/main/kotlin/com/example/auto_ledger/
          echo "--- 源码确认 ---"
          find android/app/src/main -name "*.kt" -o -name "AndroidManifest.xml"
          echo "--- res 资源确认（必须有值）---"
          ls android/app/src/main/res

      - name: 注入 ML Kit 依赖
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          GF=""
          [ -f android/app/build.gradle.kts ] && GF=android/app/build.gradle.kts
          [ -f android/app/build.gradle ] && GF=android/app/build.gradle
          echo "目标脚本: $GF"
          [ -z "$GF" ] && exit 1
          sed -i 's|^dependencies {|dependencies {\n    implementation("com.google.mlkit:text-recognition-chinese:16.0.0")|' "$GF"
          echo "--- 校验 ---"
          grep -n "mlkit" "$GF"

      - name: flutter pub get
        run: flutter pub get

      - name: 构建 APK
        run: flutter build apk --release --split-per-abi

      - name: 构建通用 APK
        run: flutter build apk --release

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: auto-ledger-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
