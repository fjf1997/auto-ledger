name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter
        run: flutter --version

      - name: 生成 Android 脚手架
        run: |
          cd /tmp
          flutter create --org com.example --project-name auto_ledger scaffold
          cd scaffold
          rm -rf lib pubspec.yaml test
          rsync -a --ignore-existing --exclude '.git' ./ "$GITHUB_WORKSPACE/"

      - name: flutter pub get
        run: flutter pub get

      - name: 构建 APK
        run: flutter build apk --release --split-per-abi

      - name: 构建通用 APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-ledger-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
